{{- $configs := .Values.deployment.nodeConfigurations }}
{{- if not $configs }}
  {{- $configs = dict "" (dict) }}
{{- end }}

{{- range $name, $nodeConfig := $configs }}
{{- $kind := $.Values.deployment.kind }}
{{- if eq $kind "StatefulSet" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "garage.fullname" $ }}{{- if $name }}-{{ $name }}{{- end }}-headless
  labels:
    {{- include "garage.labels" $ | nindent 4 }}
    {{- if $name }}
    garage.deuxfleurs.fr/node-config: {{ $name | quote }}
    {{- end }}
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - port: {{ $.Values.service.s3.api.port }}
      targetPort: 3900
      protocol: TCP
      name: s3-api
    - port: {{ $.Values.service.s3.web.port }}
      targetPort: 3902
      protocol: TCP
      name: s3-web
  selector:
    {{- include "garage.selectorLabels" $ | nindent 4 }}
    {{- if $name }}
    garage.deuxfleurs.fr/node-config: {{ $name | quote }}
    {{- end }}
---
{{- end }}
{{- end }}
