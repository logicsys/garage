{{- $configs := .Values.deployment.nodeConfigurations }}
{{- if not $configs }}
  {{- $configs = dict "" (dict) }}  {{/* Single entry with empty name = use all global values */}}
{{- end }}

{{- range $name, $nodeConfig := $configs }}
{{- $kind := $.Values.deployment.kind }}

{{/* Determine if hostPath should be used */}}
{{- $metaHostPath := dig "persistence" "meta" "hostPath" "" $nodeConfig }}
{{- $dataHostPath := dig "persistence" "data" "hostPath" "" $nodeConfig }}
{{- $useHostPath := or (eq $kind "DaemonSet") (and $metaHostPath $dataHostPath) }}

{{/* Determine replica count - enforce 1 when using hostPath */}}
{{- $replicaCount := $.Values.deployment.replicaCount }}
{{- if $useHostPath }}
  {{- $replicaCount = 1 }}
{{- end }}

{{/* VALIDATION */}}
{{- if and $name (not (regexMatch "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$" $name)) }}
  {{- fail (printf "nodeConfiguration name '%s' must be a valid DNS label (lowercase, alphanumeric, hyphens)" $name) }}
{{- end }}
{{- if and $name (not $nodeConfig.nodeSelector) }}
  {{- fail (printf "nodeConfiguration '%s' requires 'nodeSelector'" $name) }}
{{- end }}
{{- if or (and $metaHostPath (not $dataHostPath)) (and $dataHostPath (not $metaHostPath)) }}
  {{- fail (printf "nodeConfiguration '%s': both meta.hostPath and data.hostPath must be set" $name) }}
{{- end }}

apiVersion: apps/v1
kind: {{ $kind }}
metadata:
  name: {{ include "garage.fullname" $ }}{{- if $name }}-{{ $name }}{{- end }}
  labels:
    {{- include "garage.labels" $ | nindent 4 }}
    {{- if $name }}
    garage.deuxfleurs.fr/node-config: {{ $name | quote }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "garage.selectorLabels" $ | nindent 6 }}
      {{- if $name }}
      garage.deuxfleurs.fr/node-config: {{ $name | quote }}
      {{- end }}
  {{- if eq $kind "StatefulSet" }}
  replicas: {{ $replicaCount }}
  serviceName: {{ include "garage.fullname" $ }}{{- if $name }}-{{ $name }}{{- end }}-headless
  podManagementPolicy: {{ $.Values.deployment.podManagementPolicy }}
  updateStrategy:
    type: {{ $.Values.deployment.updateStrategy | default "RollingUpdate" }}
  {{- else if eq $kind "DaemonSet" }}
  updateStrategy:
    type: {{ $.Values.deployment.updateStrategy | default "RollingUpdate" }}
  {{- end }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") $ | sha256sum }}
      {{- with $.Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "garage.labels" $ | nindent 8 }}
        {{- if $name }}
        garage.deuxfleurs.fr/node-config: {{ $name | quote }}
        {{- end }}
    spec:
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "garage.serviceAccountName" $ }}
      securityContext:
        {{- toYaml $.Values.podSecurityContext | nindent 8 }}
      initContainers:
        # Copies garage.toml from configmap to temporary etc volume and replaces RPC secret placeholder
        - name: {{ $.Chart.Name }}-init
          image: "{{ $.Values.initImage.repository }}:{{ $.Values.initImage.tag }}"
          imagePullPolicy: {{ $.Values.initImage.pullPolicy }}
          command: ["sh", "-c", "sed \"s/__RPC_SECRET_REPLACE__/$RPC_SECRET/\" /mnt/garage.toml > /mnt/etc/garage.toml"]
          env:
            - name: RPC_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "garage.rpcSecretName" $ }}
                  key: rpcSecret
          securityContext:
            {{- toYaml $.Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: configmap
              mountPath: /mnt/garage.toml
              subPath: garage.toml
            - name: etc
              mountPath: /mnt/etc
      containers:
        - name: {{ $.Chart.Name }}
          securityContext:
            {{- toYaml $.Values.securityContext | nindent 12 }}
          image: "{{ $.Values.image.repository }}:{{ $.Values.image.tag | default $.Chart.AppVersion }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          ports:
            - containerPort: 3900
              name: s3-api
            - containerPort: 3902
              name: web-api
            - containerPort: 3903
              name: admin
          {{- with $.Values.environment }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: meta
              mountPath: /mnt/meta
            - name: data
              mountPath: /mnt/data
            - name: etc
              mountPath: /etc/garage.toml
              subPath: garage.toml
          {{- with $.Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $.Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $.Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml ($nodeConfig.resources | default $.Values.resources) | nindent 12 }}
      volumes:
        - name: configmap
          configMap:
            name: {{ include "garage.fullname" $ }}-config
        - name: etc
          emptyDir: {}
        {{- if $.Values.persistence.enabled }}
        {{- if $useHostPath }}
        - name: meta
          hostPath:
            path: {{ $metaHostPath | default $.Values.persistence.meta.hostPath }}
            type: DirectoryOrCreate
        - name: data
          hostPath:
            path: {{ $dataHostPath | default $.Values.persistence.data.hostPath }}
            type: DirectoryOrCreate
        {{- end }}
        {{- else }}
        - name: meta
          emptyDir: {}
        - name: data
          emptyDir: {}
        {{- end }}
        {{- with $.Values.extraVolumes }}
          {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with ($nodeConfig.nodeSelector | default $.Values.nodeSelector) }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with ($nodeConfig.affinity | default $.Values.affinity) }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with ($nodeConfig.tolerations | default $.Values.tolerations) }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{/* volumeClaimTemplates only for StatefulSet WITHOUT hostPath */}}
  {{- if and $.Values.persistence.enabled (eq $kind "StatefulSet") (not $useHostPath) }}
  volumeClaimTemplates:
  - metadata:
      name: meta
    spec:
      accessModes: [ "ReadWriteOnce" ]
    {{- $metaStorageClass := dig "persistence" "meta" "storageClass" nil $nodeConfig }}
    {{- if ne $metaStorageClass nil }}
      storageClassName: {{ $metaStorageClass | quote }}
    {{- else if hasKey $.Values.persistence.meta "storageClass" }}
      storageClassName: {{ $.Values.persistence.meta.storageClass | quote }}
    {{- end }}
      resources:
        requests:
          storage: {{ dig "persistence" "meta" "size" $.Values.persistence.meta.size $nodeConfig | quote }}
  - metadata:
      name: data
    spec:
      accessModes: [ "ReadWriteOnce" ]
    {{- $dataStorageClass := dig "persistence" "data" "storageClass" nil $nodeConfig }}
    {{- if ne $dataStorageClass nil }}
      storageClassName: {{ $dataStorageClass | quote }}
    {{- else if hasKey $.Values.persistence.data "storageClass" }}
      storageClassName: {{ $.Values.persistence.data.storageClass | quote }}
    {{- end }}
      resources:
        requests:
          storage: {{ dig "persistence" "data" "size" $.Values.persistence.data.size $nodeConfig | quote }}
  {{- end }}
---
{{- end }}
