{{- if .Values.tlsproxy.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "garage.fullname" . }}-config-tlsproxy
data:
  tlsproxy.conf: |-
    # https://ssl-config.mozilla.org/#server=nginx&version=1.27.3&config=modern&openssl=3.4.0&ocsp=false&guideline=5.7

    # modern configuration
    ssl_protocols TLSv1.3;
    ssl_ecdh_curve X25519:prime256v1:secp384r1;
    ssl_prefer_server_ciphers off;
    # uncomment to enable if ssl_protocols includes TLSv1.2 or earlier;
    # see also ssl_session_ticket_key alternative to stateful session cache
    #ssl_session_timeout 1d;
    #ssl_session_cache shared:MozSSL:10m;  # about 40000 sessions

    client_max_body_size {{ .Values.tlsproxy.config.http.client_max_body_size }};
    client_body_buffer_size 256k;

    upstream s3_backend { server 127.0.0.1:3900; }
    server {
        listen 3910 ssl;
        listen [::]:3910 ssl;
        http2 on;
        ssl_certificate /etc/tlsproxy/tls.crt;
        ssl_certificate_key /etc/tlsproxy/tls.key;

        # HSTS (ngx_http_headers_module is required) (63072000 seconds)
        add_header Strict-Transport-Security "max-age=63072000" always;

        location / {
          proxy_pass http://s3_backend;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header Host $http_host;
          # Disable buffering to a temporary file.
          proxy_max_temp_file_size 0;
        }
    }

    upstream web_backend { server 127.0.0.1:3902; }
    server {
        listen 3912 ssl;
        listen [::]:3912 ssl;
        http2 on;
        ssl_certificate /etc/tlsproxy/tls.crt;
        ssl_certificate_key /etc/tlsproxy/tls.key;

        # HSTS (ngx_http_headers_module is required) (63072000 seconds)
        add_header Strict-Transport-Security "max-age=63072000" always;

        location / {
          proxy_pass http://web_backend;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header Host $http_host;
          # Disable buffering to a temporary file.
          proxy_max_temp_file_size 0;
        }

    }

    upstream admin_backend { server 127.0.0.1:3903; }
    server {
        listen 3913 ssl;
        listen [::]:3913 ssl;
        http2 on;
        ssl_certificate /etc/tlsproxy/tls.crt;
        ssl_certificate_key /etc/tlsproxy/tls.key;

        # HSTS (ngx_http_headers_module is required) (63072000 seconds)
        add_header Strict-Transport-Security "max-age=63072000" always;

        location / {
          proxy_pass http://admin_backend;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header Host $http_host;
          # Disable buffering to a temporary file.
          proxy_max_temp_file_size 0;
        }
    }
{{- end }}
